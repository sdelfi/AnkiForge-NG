name: Release

# Every push to main runs tests/lint and builds the .ankiaddon; a GitHub
# Release is only published if the version in src/ankiforge/__init__.py
# doesn't already have a matching vX.Y.Z tag, so ordinary commits are a
# no-op and only an actual version bump cuts a release. AnkiWeb itself has
# no upload API — the built .ankiaddon still needs to be uploaded there by
# hand, see https://ankiweb.net/shared/addons/ ("Share Add-on" -> new
# branch/version).

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Determine version and whether it's already released
        id: version
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/ankiforge/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$version" | grep -q .; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .ankiaddon
        if: steps.version.outputs.already_released == 'false'
        id: build
        run: |
          uv run python scripts/build_ankiaddon.py
          echo "file=$(ls dist/*.ankiaddon)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.already_released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: ${{ steps.build.outputs.file }}
          generate_release_notes: true
